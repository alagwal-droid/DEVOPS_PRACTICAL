services:
  web:
    build: ./python-api
    container_name: devops-web
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: devops-redis
    volumes:
      - redis-data:/data

volumes:
  redis-data:
